spring.application.name=backend

# Credentials come from user environment variables (see readme.md); never commit real values.
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}

# Boot 4 names: spring.data.mongodb.* would silently fall back to localhost:27017.
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=cineconecta

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate

# JWT: Base64 key of at least 32 bytes from JWT_SECRET. Empty = random key per restart (dev only).
cineconecta.jwt.secret=${JWT_SECRET:}
cineconecta.jwt.expiration=PT8H

# Origins allowed to call the API from a browser (comma-separated).
cineconecta.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Demo of a failure between the inserts and the commit (POST /api/subscriptions with
# "simulateFailure": true). Off by default; turn on only for the sustentacion.
cineconecta.demo.simulate-failures=${DEMO_SIMULATE_FAILURES:false}
