spring.application.name=backend

# Credentials come from user environment variables (see readme.md); never commit real values.
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}

# Boot 4 names: spring.data.mongodb.* would silently fall back to localhost:27017.
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=cineconecta

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
